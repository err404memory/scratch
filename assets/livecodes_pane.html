<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="http://localhost:4173/sdk/livecodes.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0d1117; overflow: hidden; }
#livecodes-container { width: 100%; height: 100%; }
#error-banner {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #e06c75;
    color: #fff;
    padding: 8px 12px;
    font-family: sans-serif;
    font-size: 12px;
    z-index: 9999;
}
</style>
</head>
<body>
<div id="error-banner"></div>
<div id="livecodes-container"></div>

<script>
"use strict";

(function() {
    const container = document.getElementById('livecodes-container');
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
        console.error(msg);
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
    }

    if (typeof livecodes === 'undefined' || !livecodes.createPlayground) {
        showError('LiveCodes SDK failed to load. Is the local server running?');
        return;
    }

    let playground = null;
    let _pendingConfig = null;
    let _editMode = true;
    let _suppressChange = false;

    function initPlayground(initialConfig) {
        const config = {
            mode: 'lite',
            view: 'editor',
            ...(initialConfig || {}),
        };

        livecodes.createPlayground(container, {
            config: config,
            appUrl: 'http://localhost:4173/',
            loading: 'eager',
        }).then(function(pg) {
            playground = pg;

            playground.watch('code', function(_ref) {
                if (_suppressChange || !window.Bridge) return;
                var cfg = _ref.config;
                Bridge.contentChanged(JSON.stringify(cfg));
            });

            if (_pendingConfig !== null) {
                try {
                    playground.setConfig(JSON.parse(_pendingConfig));
                } catch (e) {
                    console.error('Failed to load pending config:', e);
                }
                _pendingConfig = null;
            }

            if (!_editMode) {
                playground.show('result');
            }

            if (window.Bridge) {
                Bridge.ready();
            }
        }).catch(function(err) {
            showError('LiveCodes failed to start: ' + (err && err.message ? err.message : String(err)));
        });
    }

    window.loadConfig = function(configJson) {
        if (playground) {
            _suppressChange = true;
            playground.setConfig(JSON.parse(configJson)).then(function() {
                _suppressChange = false;
            }).catch(function(e) {
                _suppressChange = false;
                console.error('loadConfig failed:', e);
            });
        } else {
            _pendingConfig = configJson;
        }
    };

    window.setEditMode = function(enabled) {
        _editMode = Boolean(enabled);
        if (!playground) return;
        if (_editMode) {
            playground.show('editor');
        } else {
            playground.show('result');
        }
    };

    window.getConfig = function() {
        if (!playground) return Promise.resolve('{}');
        return playground.getConfig().then(function(config) {
            return JSON.stringify(config);
        });
    };

    // Kick off playground creation
    initPlayground(null);

    // Wire QWebChannel
    new QWebChannel(qt.webChannelTransport, function(channel) {
        window.Bridge = channel.objects.bridge;
        if (playground) {
            Bridge.ready();
        }
    });
})();
</script>
</body>
</html>
