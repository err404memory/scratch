<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0d1117; overflow: hidden; }
#livecodes-container, #livecodes-frame { width: 100%; height: 100%; border: 0; display: block; }
#error-banner {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #e06c75;
    color: #fff;
    padding: 8px 12px;
    font-family: sans-serif;
    font-size: 12px;
    z-index: 9999;
}
</style>
</head>
<body>
<div id="error-banner"></div>
<div id="livecodes-container"></div>

<script>
"use strict";

(function() {
    const container = document.getElementById('livecodes-container');
    const errorBanner = document.getElementById('error-banner');
    const params = new URLSearchParams(window.location.search);
    const appUrl = (params.get('appUrl') || 'http://localhost:4173/').replace(/\/?$/, '/');

    function showError(msg) {
        console.error(msg);
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
    }

    let frame = null;
    let _ready = false;
    let _pendingConfig = null;
    let _sourceText = '';
    let _editMode = true;
    let _config = { markup: { language: 'markdown', content: '' } };
    let _apiId = 0;

    function sourceFromConfig(config) {
        const markup = config && config.markup ? config.markup : {};
        const style = config && config.style ? config.style : {};
        const script = config && config.script ? config.script : {};
        const parts = [];
        const hasStyle = Boolean(style.content);
        const hasScript = Boolean(script.content);
        if (markup.content && !String(markup.content).includes('scratch-css-preview')) {
            parts.push(markup.language === 'markdown' || (markup.language === 'html' && !hasStyle && !hasScript)
                ? markup.content
                : `\`\`\`${markup.language || 'html'}\n${markup.content}\n\`\`\``);
        }
        if (style.content) parts.push(`\`\`\`css\n${style.content}\n\`\`\``);
        if (script.content) parts.push(`\`\`\`${script.language || 'javascript'}\n${script.content}\n\`\`\``);
        return parts.join('\n\n');
    }

    function appOrigin() {
        return new URL(appUrl).origin;
    }

    function postToLiveCodes(message) {
        if (!frame || !frame.contentWindow) return;
        frame.contentWindow.postMessage(message, appOrigin());
    }

    function callApi(method, args) {
        postToLiveCodes({ method, id: String(++_apiId), args: args || [] });
    }

    function applyConfig(config) {
        _config = { mode: 'lite', view: _editMode ? 'editor' : 'result', ...(config || {}) };
        _sourceText = sourceFromConfig(_config);
        if (_ready) {
            callApi('setConfig', [_config]);
            callApi('show', [_editMode ? 'editor' : 'result']);
        } else {
            _pendingConfig = JSON.stringify(_config);
        }
    }

    function initPlayground() {
        frame = document.createElement('iframe');
        frame.id = 'livecodes-frame';
        frame.allow = 'accelerometer; camera; encrypted-media; display-capture; geolocation; gyroscope; microphone; midi; clipboard-read; clipboard-write; web-share';
        frame.allowFullscreen = true;
        const url = new URL(appUrl);
        url.searchParams.set('embed', 'true');
        url.searchParams.set('loading', 'eager');
        url.searchParams.set('sdkVersion', '0.13.0');
        frame.src = url.href;
        container.replaceChildren(frame);
    }

    window.addEventListener('message', function(event) {
        if (event.origin !== appOrigin()) return;
        const data = event.data || {};
        if (data.type === 'livecodes-get-config') {
            postToLiveCodes({ type: 'livecodes-config', payload: _config });
            return;
        }
        if (data.type === 'livecodes-ready') {
            _ready = true;
            if (_pendingConfig) {
                applyConfig(JSON.parse(_pendingConfig));
                _pendingConfig = null;
            }
            callApi('show', [_editMode ? 'editor' : 'result']);
            if (window.Bridge) Bridge.ready();
            return;
        }
        if (data.type === 'livecodes-change') {
            const cfg = data.payload && data.payload.config ? data.payload.config : data.payload;
            if (!cfg) return;
            _config = cfg;
            _sourceText = sourceFromConfig(cfg);
            if (window.Bridge) Bridge.contentChanged(JSON.stringify(cfg));
            return;
        }
        if (data.type === 'scratch-open-context-menu') {
            if (window.Bridge) Bridge.openContextMenu();
        }
    });

    window.loadConfig = function(configJson) {
        applyConfig(JSON.parse(configJson));
    };

    window.loadNoteSource = function(source, configJson) {
        _sourceText = source || '';
        window.loadConfig(configJson);
    };

    window.setPreviewHtml = function(html) {
        _sourceText = html || '';
        window.loadConfig(JSON.stringify({ markup: { language: 'html', content: html || '' } }));
    };

    window.focusEditor = function() {
        _editMode = true;
        if (_ready) callApi('show', ['editor']);
    };

    window.setBgColor = function() {};

    window.getSharePayload = function() {
        const selection = window.getSelection ? String(window.getSelection()) : '';
        const text = selection.trim() || _sourceText;
        return { html: text, text: text.replace(/<[^>]+>/g, '').trim() || text, selected: Boolean(selection.trim()) };
    };

    window.setEditMode = function(enabled) {
        _editMode = Boolean(enabled);
        if (_ready) callApi('show', [_editMode ? 'editor' : 'result']);
    };

    window.callLiveCodesApi = function(method, args) {
        callApi(method, Array.isArray(args) ? args : []);
    };

    window.callLiveCodesEditCommand = function(command) {
        postToLiveCodes({ type: 'scratch-edit-command', command: command });
    };

    window.getConfig = function() {
        return Promise.resolve(JSON.stringify(_config));
    };

    initPlayground();

    if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.Bridge = channel.objects.bridge;
            if (_ready) Bridge.ready();
        });
    } else {
        console.warn('QWebChannel is not available; running LiveCodes pane without Scratch bridge.');
    }
})();
</script>
</body>
</html>
